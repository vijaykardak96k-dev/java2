name: CI-CD Deploy to kOps Cluster

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java + Maven (NO EC2 needed)
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3. Build WAR
      - name: Build Maven Package
        run: mvn clean package

      # 4. Docker login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/java2:${{ github.sha }} .

      # 6. Push Docker image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/java2:${{ github.sha }}

      # 7. Setup SSH
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 8. Deploy to kOps cluster
      - name: Deploy to Kubernetes
        run: |
          ssh ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            kubectl set image deployment/java2 java2=${{ secrets.DOCKER_USERNAME }}/java2:${{ github.sha }}
            kubectl rollout status deployment/java2
          EOF
