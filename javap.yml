---
apiVersion: apps/v1
kind: Deployment
metadata:
  name : javaD

spec:
  selector:
    matchLabels:
      app: javaD

  template:
    metadata:
      labels:
        app : javaD

    spec:
      containers:
        - name: javaD-cont
          image: java:v1
          imagePullPolicy: Never
          ports:
          - containerPort: 8080


---
apiVersion: v1
kind: Service
metadata:
  name: javaD-service

spec:
  type: NodePort

  selector:
    app : javaD

  ports:
    - port: 8080
      targetPort: 8080
