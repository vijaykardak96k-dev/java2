---
apiVersion: apps/v1
kind: Deployment
metadata:
  name : javad

spec:
  selector:
    matchLabels:
      app: javad

  template:
    metadata:
      labels:
        app : javad

    spec:
      containers:
        - name: javad-cont
          image: java:v1
          imagePullPolicy: Never
          ports:
          - containerPort: 8080


---
apiVersion: v1
kind: Service
metadata:
  name: javad-service

spec:
  type: NodePort

  selector:
    app : javad

  ports:
    - port: 8080
      targetPort: 8080
